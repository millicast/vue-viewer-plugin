name: pnpm run build
description: Shared pnpm build step

runs:
  using: composite
  steps:
    - uses: millicast/pnpm-setup@v3
      with:
        node-version-file: .nvmrc
        cache: true
        install: false

    - name: 'pnpm run build'
      shell: 'bash --noprofile --norc -euo pipefail {0}'
      run: |
        pnpm ci
        pnpm run build

        printf '\nNODE: %s\nPNPM: %s\n\n' "$(node --version)" "$(pnpm --version)"

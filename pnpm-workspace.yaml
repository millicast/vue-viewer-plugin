injectWorkspacePackages: true

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - ua-parser-js@1.0.41
engineStrict: true

# Transitive-only advisories that Dependabot cannot apply on its own
overrides:
  postcss-selector-parser@6: ^6.1.3
  postcss-selector-parser@7: ^7.1.3
  # No provenance on the versions babel/eslint-plugin-vue/vue-cli pin, which
  # blocks lockfile re-resolution under trustPolicy: no-downgrade
  semver@5: ^7.8.0
  semver@6: ^7.8.0
  css-declaration-sorter: ^7.4.0
  ua-parser-js: ^1.0.41

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  yorkie: true
